name: Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests



      - name: Upload to Azure VM
        env:
          AZURE_SSH_KEY: ${{ secrets.azure }}
        run: |
          mkdir -p ~/.ssh
          echo "$AZURE_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Copy the main .jar file
          scp -i ~/.ssh/id_rsa target/TP_GRUPO_MA_MA_13-1.0-SNAPSHOT.jar nutrevidas@104.41.28.6:/home/nutrevidas/target/
          # Copy the dependency directory
          scp -i ~/.ssh/id_rsa -r target/dependency nutrevidas@104.41.28.6:/home/nutrevidas/target/
          # Start the application on the VM
          ssh -i ~/.ssh/id_rsa nutrevidas@104.41.28.6 << EOF
            pkill -f 'java -jar' || true
            cd /home/nutrevidas
            sudo nohup java -cp "target/TP_GRUPO_MA_MA_13-1.0-SNAPSHOT.jar:target/dependency/*" ar.edu.utn.frba.dds.server.App > output.log 2>&1 &
          EOF
      
